version: '3.9'

services:

  backend:
    build: ./backend
    container_name: rave-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-*}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      BOT_TOKEN: ${BOT_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

